    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Система мониторинга - Фармацевтический склад" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Система мониторинга - Фармацевтический склад" />
    <meta property="twitter:description" content="Профессиональная система мониторинга температуры и влажности с соблюдением стандартов GMP/GDP" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <title>Мониторинг температуры - Фармацевтический склад</title>
    
    <!-- Prevent Flash of Unstyled Content -->
    <style>
      /* Минимальные стили для предотвращения FOUC */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8f9fa;
      }
      
      /* Темная тема для body */
      body.dark {
        background-color: #212529;
        color: #dee2e6;
      }
      
      /* Loader для начальной загрузки */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      /* Темная тема для экрана загрузки */
      body.dark #loading-screen {
        background: #212529;
        color: #dee2e6;
      }
      
      body.dark #loading-screen p {
        color: rgba(222, 226, 230, 0.75);
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid #e9ecef;
        border-top: 3px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Скрыть загрузчик после загрузки React */
      .loaded #loading-screen {
        display: none;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BHrOl2GY.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-BK3mGAYW.css">
  </head>
  <body>
    <!-- Экран загрузки -->
    <div id="loading-screen">
      <div style="text-align: center;">
        <div class="loading-spinner"></div>
        <p style="margin-top: 1rem; color: #6c757d;">Загрузка системы мониторинга...</p>
      </div>
    </div>
    
    <!-- Основное приложение React -->
    <div id="root"></div>
    
    <!-- Скрипт для инициализации темы до загрузки React -->
    <script>
      // Инициализация темы из localStorage
      (function() {
        const savedTheme = localStorage.getItem('app-theme') || 'light';
        const isDark = savedTheme === 'dark' || 
          (savedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-bs-theme', 'dark');
          document.body.classList.add('dark');
        }
      })();
    </script>
    
    <!-- Скрипт для скрытия загрузчика -->
    <script>
      // Скрыть загрузчик после загрузки DOM
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 100);
      });
      
      // Fallback на случай проблем с React
      window.addEventListener('load', function() {
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 2000);
      });
    </script>
    
  </body>
</html>
